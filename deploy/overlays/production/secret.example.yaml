apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: auth-platform
type: Opaque
stringData:
  # Database credentials for DB_HOST/DB_NAME from the production ConfigMap.
  DB_USER: auth
  DB_PASSWORD: replace-with-strong-database-password

  # Redis connection used by the OIDC adapter/cache.
  REDIS_URL: redis://redis.auth.svc.cluster.local:6379

  # node-oidc-provider cookie signing keys.
  # Use at least two high-entropy values, each 32+ characters, comma-separated.
  OIDC_COOKIE_KEYS: replace-with-random-cookie-key-1-32chars-min,replace-with-random-cookie-key-2-32chars-min

  # 32-byte key for persisted JWKS encryption.
  # Accepted formats: 64 hex characters or 44 base64 characters.
  JWKS_ENCRYPTION_KEY: replace-with-64-hex-chars-or-44-base64-chars

  # Secret for OTP token hashing, minimum 16 characters.
  OTP_TOKEN_SECRET: replace-with-random-otp-secret-32chars-min

  # Required by preserved Migration20260404000001 on a fresh database.
  # bootstrap:admin:prod also uses these only when the admin is missing and
  # never resets an existing password.
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: replace-with-strong-admin-password

  # Optional values used by the preserved initial migration.
  ADMIN_UI_URL: https://ui.auth.example.com
  SEED_AUTH_PUBLIC_BASE: https://auth.example.com
  SEED_GOOGLE_OIDC_CLIENT_ID: ''
  SEED_GOOGLE_OIDC_CLIENT_SECRET: ''

  # Optional SMTP auth. Keep empty when SMTP_HOST does not require auth.
  SMTP_USER: ''
  SMTP_PASS: ''
