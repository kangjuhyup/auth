<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">200 VU 30분 내구성 시험의 분당 처리량과 전체 요청 지연시간</title>
  <desc id="desc">30개 1분 구간 모두 통과했다. 처리량은 164.82에서 183.82 RPS였고, 가장 높은 전체 요청 p95와 p99는 18분의 105.91과 179.53 밀리초였다.</desc>
  <rect width="960" height="640" rx="18" fill="#f8fafc"/>
  <text x="48" y="45" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">200 VU · 30분 내구성 추이</text>
  <text x="48" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#475569">각 점은 60초 평가 구간 · 30/30 구간 PASS · 실패율 0%</text>
  <text x="70" y="103" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">처리량 (RPS)</text>
