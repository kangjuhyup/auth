worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format gateway '$remote_addr $request_method $uri $status '
                     '$body_bytes_sent $request_time $upstream_response_time';

  access_log /var/log/nginx/access.log gateway;
  error_log /dev/null emerg;

  server {
    listen 13443 ssl;
    server_name auth-service;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    client_max_body_size 1m;

    location / {
      proxy_pass http://auth-service:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host auth-service:13443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host auth-service:13443;
      proxy_set_header X-Forwarded-Port 13443;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
